name: yearn-budget-shape
on:
  issues:
    types: [labeled]
jobs:
  notify:
    if: github.event.label.name == 'budget request'
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: |
          echo "TRIGGERED label=${{ github.event.label.name }}"
          echo "TITLE=${{ github.event.issue.title }}"
          echo "ACTOR=${{ github.actor }}"

